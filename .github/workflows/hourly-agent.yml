name: Shoyru hourly work cycle

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: shoyru-agent-cycle
  cancel-in-progress: false

jobs:
  wake-shoyru:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run one Shoyru work cycle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "Missing repository secret CRON_SECRET"; exit 1; }
          curl --fail-with-body --retry 2 --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://aishoyru.vercel.app/api/cron/agent
