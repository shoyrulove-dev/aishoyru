name: Shoyru hourly work cycle
# Push chỉ kiểm tra endpoint; khóa theo giờ quyết định có cần chạy hay không.

on:
  schedule:
    # GitHub có thể bỏ một số schedule. Sáu nhịp thăm dò tạo nhiều cơ hội đánh thức;
    # endpoint vẫn khóa theo giờ nên không tạo nhiều lượt AI trùng nhau.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: shoyru-agent-cycle
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  wake-shoyru:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run one Shoyru work cycle
        run: |
          oidc_response=$(curl --silent --show-error --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=aishoyru-agent")
          oidc_token=$(echo "$oidc_response" | jq -r '.value')
          test -n "$oidc_token" && test "$oidc_token" != "null" || { echo "::error::Could not obtain GitHub OIDC token"; exit 1; }
          endpoint="https://shoyruai.blissbiovn.com/api/cron/agent"
          for attempt in {1..18}; do
            http_code=$(curl --silent --show-error --max-time 90 \
              --output response.json --write-out "%{http_code}" \
              -H "Authorization: Bearer $oidc_token" \
              "$endpoint") || http_code="000"
            [ "$http_code" != "401" ] && [ "$http_code" != "000" ] && [ "$http_code" != "500" ] && [ "$http_code" != "502" ] && [ "$http_code" != "503" ] && [ "$http_code" != "504" ] && break
            sleep 10
          done
          response=$(tr '\n' ' ' < response.json | head -c 1000)
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Agent endpoint returned HTTP $http_code: $response"
            exit 1
          fi
          echo "::notice::Agent cycle completed (HTTP $http_code): $response"
