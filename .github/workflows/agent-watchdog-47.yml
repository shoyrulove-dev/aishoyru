name: Shoyru watchdog at minute 47

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

concurrency:
  group: shoyru-agent-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-shoyru:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check and wake Shoyru
        run: |
          http_code="000"
          for attempt in 1 2 3; do
            http_code=$(curl --silent --show-error --max-time 120 \
              --output response.json --write-out "%{http_code}" \
              https://shoyruai.blissbiovn.com/api/heartbeat) || http_code="000"
            [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ] && break
            sleep 10
          done
          response=$(tr '\n' ' ' < response.json | head -c 1000)
          echo "Shoyru responded HTTP $http_code: $response"
          [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]
