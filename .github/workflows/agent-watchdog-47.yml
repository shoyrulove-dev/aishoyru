name: Shoyru watchdog at minute 37

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  group: shoyru-agent-cycle
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  check-shoyru:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check and wake Shoyru
        run: |
          oidc_response=$(curl --silent --show-error --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=aishoyru-agent")
          oidc_token=$(echo "$oidc_response" | jq -r '.value')
          test -n "$oidc_token" && test "$oidc_token" != "null" || exit 1
          http_code=$(curl --silent --show-error --max-time 90 \
            --output response.json --write-out "%{http_code}" \
            -H "Authorization: Bearer $oidc_token" \
            https://shoyruai.blissbiovn.com/api/cron/agent) || http_code="000"
          response=$(tr '\n' ' ' < response.json | head -c 1000)
          echo "Shoyru responded HTTP $http_code: $response"
          [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]
