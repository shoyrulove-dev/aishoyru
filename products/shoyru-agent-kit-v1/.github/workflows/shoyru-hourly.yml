name: Agent hourly cycle

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  wake-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Run one verified cycle
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.AGENT_CRON_URL }}"
